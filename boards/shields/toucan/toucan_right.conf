CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

CONFIG_I2C=y
CONFIG_INPUT_TPS43=y

# INPUT_THREAD_STACK_SIZE in Kconfig.defconfig has no effect: Zephyr's subsys/input
# Kconfig already sets `default 1024` and the first default wins. Set it here instead.
CONFIG_INPUT_THREAD_STACK_SIZE=2048

CONFIG_ZMK_BATTERY_REPORTING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# 60 minutes before deep sleep — reconnecting BT is painful, power delta is small
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# 30-second idle timeout before ZMK-level idle behavior kicks in. At this boundary the
# Azoteq TPS43 driver's own idle sleeper (tps43_idle_sleeper.c) subscribes to ZMK
# activity-state events and puts the pad into its low-power report-rate state itself —
# unlike the Cirque Pinnacle, no CONFIG_ZMK_PM_SOFT_OFF is needed for that.
CONFIG_ZMK_IDLE_TIMEOUT=30000
